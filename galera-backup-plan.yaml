apiVersion: triliovault.trilio.io/v1
kind: BackupPlan
metadata:
  name: openstack-galera-backup
  namespace: openstack
spec:
  backupConfig:
    target:
      name: sa-lab-nfs-share1 # CHANGE THIS TO YOUR TARGET
      namespace: openstack

  backupPlanComponents:
    customSelector:
      selectResources:
        gvkSelector:
        - groupVersionKind:
            group: apps
            kind: StatefulSet
            version: v1
          objects:
            - openstack-galera

        - groupVersionKind:
            group: ""
            kind: PersistentVolumeClaim
            version: v1
          objects:
            - mysql-db-openstack-galera-0
            - mysql-db-openstack-galera-1
            - mysql-db-openstack-galera-2

        - groupVersionKind:
            group: ""
            kind: Secret
            version: v1
          objects:
            - osp-secret
            - combined-ca-bundle

        - groupVersionKind:
            group: ""
            kind: Service
            version: v1
          objects:
            - openstack-galera   # headless, DNS for the pods
            # The ClusterIP Service "openstack" is deliberately NOT backed up: the operator
            # recreates it, T4K restores Services with their finalizers (the operator's
            # finalizer would block deletion if the Galera CR never reconciles), and its
            # pod-name selector is re-elected on bootstrap anyway.

        - groupVersionKind:
            group: ""
            kind: ServiceAccount
            version: v1
          objects:
            - galera-openstack

        - groupVersionKind:
            group: ""
            kind: ConfigMap
            version: v1
          objects:
            - openstack-config-data

  hookConfig:
    mode: Sequential
    hooks:
      - hook:
          name: galera-backup-hook
        podSelector:
          labels:
            - matchLabels:
                # cr: galera-<Galera CR name>. Do NOT use app: galera alone: RHOSO deployments
                # with several Galera CRs (e.g. openstack and openstack-keystone) label every
                # Galera pod app=galera, and the hook would run on all of them.
                cr: galera-openstack
        containerRegex: "galera"
